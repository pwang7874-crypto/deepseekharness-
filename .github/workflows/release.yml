name: Publish desktop installers

on:
  push:
    tags: ["v*"]
    branches: [fix/pet-bridge-namespace]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis --no-sign
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
          - name: macOS ARM64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app
    name: Release ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/pet-companion prepare:plugin
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/pet-companion
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.0-beta.2' }}
          releaseName: DSH Pet Voice ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.0-beta.2' }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: 下载与你电脑系统相符的安装包。首次打开桌宠会自动寻找 DSH、安装内置插件并连接，不需要运行 Git 或 pnpm 命令。
          releaseDraft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: ${{ matrix.args }}
